; Ajustes de PHP para el contenedor.
date.timezone = America/Guatemala
; Un Aplicar de 300 SKUs tarda 2-3 min. App Service corta la petición a los 230 s; esto no debe cortar antes.
max_execution_time = 300
memory_limit = 512M
upload_max_filesize = 10M
post_max_size = 12M
expose_php = Off
; Los errores van al log de Apache (salida del contenedor), no a la página.
display_errors = Off
log_errors = On
